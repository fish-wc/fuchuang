<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Test Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socket = io.connect('http://localhost:5000'); // 替换为您的服务器地址和端口号

            // 当连接建立时，在控制台打印连接成功的消息
            socket.on('connect', function() {
                console.log('Connected to server!');
            });

            // 当连接断开时，在控制台打印连接断开的消息
            socket.on('disconnect', function() {
                console.log('Disconnected from server!');
            });

            // 发送 'train' 事件到服务器
            document.getElementById('trainButton').addEventListener('click', function() {
                const choice = document.getElementById('choiceInput').value;
                socket.emit('train', { choice: choice });
            });

            // 接收来自服务器的 'train_output' 事件，并将输出显示在页面上
            socket.on('train_output', function(data) {
                const outputElement = document.getElementById('trainOutput');
                outputElement.innerHTML += data.output + '<br>';
                // 滚动到输出的底部
                outputElement.scrollTop = outputElement.scrollHeight;
            });
        });
    </script>
</head>
<body>
    <h1>Socket.IO Test Page</h1>
    <div>
        <label for="choiceInput">Enter Choice:</label>
        <input type="text" id="choiceInput" name="choiceInput">
        <button id="trainButton">Train</button>
    </div>
    <div id="trainOutput" style="margin-top: 10px; border: 1px solid #ccc; padding: 10px; max-height: 200px; overflow-y: auto;"></div>
</body>
</html>
